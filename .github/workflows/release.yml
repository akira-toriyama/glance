name: Release

# Thin caller of glyph's reusable rolling-DRAFT release (binary mode). A push
# to main makes `glyph release` compute the next version and the notes from
# each merged PR's individual (pre-squash) commits — gitmoji-driven and
# squash-safe — and create/update a single DRAFT release (no tag until you
# Publish in the UI). The verdict + draft logic and the binary that runs it
# ship together from akira-toriyama/glyph at ONE concrete tag (never a moving
# ref); this file supplies only glance's binary name + install prose. glance
# ships a bare `bin/glance` binary (built by ./build.sh), not an .app bundle,
# so it pins the reusable's `binary:` input — the first binary-mode caller.
# The git-cliff era config (cliff.toml) is gone — the classification table
# lives inside the glyph binary (`glyph rules`). The old inline workflow's
# published-release protections are subsumed: glyph writes drafts only, and
# the published floor guards the tag space.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (no draft; just artifacts)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: akira-toriyama/glyph/.github/workflows/release.yml@v3.0.0
    with:
      binary: glance
      dry-run: ${{ github.event.inputs.dry_run == 'true' }}
      install-notes: |
        ## Install

        **Homebrew:**

        ```sh
        brew install akira-toriyama/tap/glance
        ```

        **Prebuilt (`glance` below):** ad-hoc signed (not notarized).
        macOS quarantines downloads, so on first use:

        ```sh
        xattr -d com.apple.quarantine ./glance
        chmod +x ./glance
        ```

  # The tag glyph cuts lands on a commit that ALREADY EXISTS, so nothing in
  # the release flow rewrites `GlanceVersion.current`; the PR that moves the
  # verdict bumps it by hand (Sources/GlanceCore/Version.swift). This job
  # turns a forgotten bump into a red Release run on main, instead of a
  # `brew test glance` failure once the tag is out: the formula builds the
  # tag's tarball and asserts `--version` against its own version, and 0.2.0
  # shipped under v0.3.0 and v1.0.0 that way. Skipped when no release is
  # due (`next` is empty on a none verdict).
  version-sync:
    needs: release
    if: needs.release.outputs.next != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare GlanceVersion.current with the rolling draft's tag
        env:
          NEXT: ${{ needs.release.outputs.next }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^ *public static let current = "\(.*\)"$/\1/p' Sources/GlanceCore/Version.swift)"
          if [ -z "$current" ]; then
            echo "::error::Sources/GlanceCore/Version.swift no longer declares 'public static let current = \"…\"' on one line — this job reads exactly that."
            exit 1
          fi
          if [ "v$current" != "$NEXT" ]; then
            echo "::error::GlanceVersion.current is $current but the rolling draft targets $NEXT — set it to ${NEXT#v} (Sources/GlanceCore/Version.swift) before publishing; a ':bookmark:= …' commit keeps the verdict where it is."
            exit 1
          fi
          echo "GlanceVersion.current $current matches the draft's $NEXT"
